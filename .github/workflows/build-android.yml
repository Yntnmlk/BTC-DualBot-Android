name: Build BTC DualBot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BTC_DualBot_Android_Source.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Android project
        run: unzip -q BTC_DualBot_Android_Source.zip -d extracted

      - name: Download Gradle
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        working-directory: extracted/BTC_DualBot_Android
        run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTC-DualBot-debug-APK
          path: extracted/BTC_DualBot_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
